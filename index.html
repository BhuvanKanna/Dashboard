<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bhuvan's Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000000;--deep:#050509;--panel:#0A0912;--panel2:#0E0C18;
  --edge:#1E1733;--edge2:#2E2450;--hair:rgba(139,92,246,.13);
  --violet:#8B5CF6;--violet-hot:#B98BFF;--cyan:#22D3EE;--alert:#FF2D55;--alert-hot:#FF6B85;--ok:#33D69F;
  --text:#E9E4FA;--muted:#7D739C;--faint:#4A4166;
  /* --minHour is the shortest an hour row may get before the grid starts scrolling */
  --minHour:26px;--gap:18px;--pad:22px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--void);color:var(--text);
  font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
body{background-image:
  linear-gradient(var(--hair) 1px,transparent 1px),
  linear-gradient(90deg,var(--hair) 1px,transparent 1px),
  radial-gradient(ellipse 60% 45% at 22% 0%,rgba(139,92,246,.07),transparent 70%),
  radial-gradient(ellipse 50% 40% at 92% 4%,rgba(34,211,238,.035),transparent 70%);
  background-size:46px 46px,46px 46px,auto,auto}
button,input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.28)}
:focus-visible{outline:1px solid var(--cyan);outline-offset:1px}
.mono{font-family:'JetBrains Mono',monospace}

/* ── HUD ornament: corner brackets ── */
.hud{position:relative}
.hud::before,.hud::after{content:'';position:absolute;width:11px;height:11px;pointer-events:none;z-index:5}
.hud::before{top:-1px;left:-1px;border-top:1px solid var(--violet);border-left:1px solid var(--violet)}
.hud::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--violet);border-right:1px solid var(--violet)}
.hud>.br1,.hud>.br2{position:absolute;width:11px;height:11px;pointer-events:none;z-index:5}
.hud>.br1{top:-1px;right:-1px;border-top:1px solid var(--violet);border-right:1px solid var(--violet)}
.hud>.br2{bottom:-1px;left:-1px;border-bottom:1px solid var(--violet);border-left:1px solid var(--violet)}
.clip{clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}

.tbtn{background:rgba(139,92,246,.07);border:1px solid var(--edge);color:var(--muted);padding:5px 10px;
  font-size:.72rem;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--violet);color:var(--violet-hot);background:rgba(139,92,246,.14)}
.arrow{background:none;border:1px solid transparent;color:var(--muted);font-size:1rem;cursor:pointer;padding:1px 7px;line-height:1}
.arrow:hover{color:var(--violet-hot);border-color:var(--edge)}
.period{font-family:'Chakra Petch',sans-serif;font-size:.95rem;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.grow{flex:1}
.seg{display:flex;border:1px solid var(--edge)}
.seg button{background:transparent;border:none;color:var(--muted);padding:5px 11px;font-size:.7rem;cursor:pointer;
  font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.seg button:hover{background:rgba(139,92,246,.1)}
.seg button.on{background:rgba(139,92,246,.24);color:var(--violet-hot)}
.stat{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap;border:1px solid var(--edge);padding:4px 8px}
.dot{display:inline-block;width:5px;height:5px;background:var(--faint);margin-right:6px;vertical-align:middle}
.stat.busy{color:var(--cyan);border-color:rgba(34,211,238,.3)}.stat.busy .dot{background:var(--cyan)}
.stat.ok{color:var(--muted)}.stat.ok .dot{background:var(--ok)}
.stat.err{color:var(--alert);border-color:rgba(255,45,85,.4)}.stat.err .dot{background:var(--alert)}

.body{display:flex;flex-direction:column;gap:var(--gap);padding:var(--pad);height:100vh}
.row{flex:1;min-height:0;display:flex;gap:var(--gap);align-items:stretch}

/* ── control panel — sits UNDER the calendar, click-to-expand, closed by default ── */
.side{flex-shrink:0;position:relative;display:flex;flex-direction:column;
  border:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(139,92,246,.05),rgba(3,3,7,.45))}
.panelhd{display:flex;align-items:center;gap:10px;padding:7px 11px}
.side:not(.closed) .panelhd{border-bottom:1px solid var(--edge)}
.foldbtn{background:none;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;padding:0;flex-shrink:0}
.foldbtn:hover{color:var(--violet-hot)}
.foldbtn .caret{color:var(--faint);font-size:.55rem;display:inline-block}
.side.closed .foldbtn .caret{transform:rotate(-90deg)}
.panelbody{display:flex;gap:16px;align-items:flex-start;padding:11px 13px}
.side.closed .panelbody{display:none}
.sidecol{min-width:0;display:flex;flex-direction:column}
.sidecol.minicol{width:184px;flex-shrink:0}
.sidecol.calscol{flex:1;min-width:132px}
.sidecol.syscol{width:164px;flex-shrink:0}
.callist{overflow-y:auto;max-height:116px}
.callist .none{font-size:.64rem;color:var(--faint)}
.side .sechd{margin:0 0 6px}
.side .mini{margin:10px 0 0}
.side .readout{margin-top:9px}
.create{width:100%;background:linear-gradient(135deg,rgba(139,92,246,.9),rgba(93,45,214,.9));border:1px solid var(--violet-hot);
  color:#07050E;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:.75rem;letter-spacing:.14em;
  text-transform:uppercase;padding:9px;cursor:pointer}
.create:hover{background:linear-gradient(135deg,var(--violet-hot),var(--violet))}
.sechd{font-family:'JetBrains Mono',monospace;font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--faint);margin:15px 0 6px;display:flex;align-items:center;gap:6px}
.sechd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
.mini{margin:13px 0 2px}
.minihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.minihead b{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.1em;font-weight:500}
.minihead button{background:none;border:none;color:var(--muted);cursor:pointer;padding:0 4px}
.minihead button:hover{color:var(--violet-hot)}
.minigrid{display:grid;grid-template-columns:repeat(7,1fr)}
.minigrid span{font-family:'JetBrains Mono',monospace;font-size:.46rem;color:var(--faint);text-align:center;padding:2px 0}
.minigrid button{background:none;border:1px solid transparent;font-family:'JetBrains Mono',monospace;font-size:.56rem;
  color:var(--muted);padding:3px 0;cursor:pointer}
.minigrid button:hover{background:rgba(139,92,246,.18);color:var(--text)}
.minigrid button.out{color:rgba(74,65,102,.55)}
.minigrid button.today{background:var(--cyan);color:#03181D;font-weight:700}
.minigrid button.sel{border-color:var(--violet-hot);color:var(--violet-hot)}
.calrow{display:flex;align-items:center;gap:7px;padding:4px 3px;cursor:pointer;border:1px solid transparent}
.calrow:hover{background:rgba(139,92,246,.09);border-color:var(--edge)}
.swatch{width:11px;height:11px;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.calname{font-size:.69rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.calrow.off .calname{color:var(--faint)}
.dotbtn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:.72rem;opacity:0;padding:0 2px}
.calrow:hover .dotbtn{opacity:1}.dotbtn:hover{color:var(--violet-hot)}
.side select{width:100%;background:rgba(0,0,0,.5);border:1px solid var(--edge);color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:5px;outline:none;cursor:pointer}
.readout{border:1px solid var(--edge);padding:7px 8px;margin-top:14px;background:rgba(139,92,246,.04)}
.readout div{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;
  font-size:.55rem;color:var(--faint);letter-spacing:.08em;padding:2px 0}
.readout div b{color:var(--muted);font-weight:500}
.readout div.hot b{color:var(--alert-hot)}

/* ── main column — left half only, and a little under half at that ── */
.main{flex:0 0 48%;max-width:48%;min-width:0;display:flex;flex-direction:column;overflow:hidden;gap:13px}
/* hiding the tasks rail hands the freed width back to the calendar */
.row:has(.rail.hide) .main{flex:1 1 auto;max-width:100%}

/* upcoming strip */
.upnav{display:flex;align-items:center;gap:8px;flex-shrink:0}
.upnav h2{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--alert-hot);margin:0;white-space:nowrap}
.upnav .ln{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,45,85,.45),transparent)}
.upnav .ct{font-family:'JetBrains Mono',monospace;font-size:.53rem;color:var(--faint)}
.upstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;flex-shrink:0;min-height:60px}
.upcard{flex:0 0 auto;min-width:172px;max-width:230px;border:1px solid rgba(255,45,85,.34);
  border-left:2px solid var(--alert);background:linear-gradient(135deg,rgba(255,45,85,.11),rgba(10,9,18,.75));
  padding:7px 10px;cursor:pointer;position:relative}
.upcard:hover{border-color:var(--alert);background:linear-gradient(135deg,rgba(255,45,85,.18),rgba(10,9,18,.8))}
.upcard.task{border-color:rgba(255,45,85,.28)}
.upcard .when{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--alert-hot);display:flex;justify-content:space-between;gap:6px}
.upcard .when i{font-style:normal;color:var(--faint)}
.upcard .ttl{font-size:.78rem;font-weight:500;margin:4px 0 3px;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upcard .sub{font-family:'JetBrains Mono',monospace;font-size:.52rem;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upempty{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--faint);letter-spacing:.1em;
  border:1px dashed var(--edge);padding:14px 12px;flex:1;text-align:center}

/* calendar shell */
.calshell{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--edge);background:linear-gradient(180deg,rgba(10,9,18,.82),rgba(3,3,7,.7))}
.wkhead{display:grid;border-bottom:1px solid var(--edge);flex-shrink:0;background:rgba(139,92,246,.04)}
.wkhead .gut{border-right:1px solid var(--edge)}
.dh{text-align:center;padding:4px 2px;border-right:1px solid rgba(30,23,51,.7)}
.dh .dn{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.dh .dd{font-family:'Chakra Petch',sans-serif;font-size:1.05rem;font-weight:600;color:var(--muted)}
.dh.today .dn{color:var(--cyan)}
.dh.today .dd{color:#03181D;background:var(--cyan);width:26px;height:26px;display:inline-flex;
  align-items:center;justify-content:center}
.allday{display:grid;border-bottom:1px solid var(--edge);min-height:19px;flex-shrink:0}
.allday .gut{border-right:1px solid var(--edge);font-family:'JetBrains Mono',monospace;font-size:.43rem;
  color:var(--faint);text-align:right;padding:2px 4px 0 0}
.adc{border-right:1px solid rgba(30,23,51,.7);padding:2px;display:flex;flex-direction:column;gap:2px}
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
/* Rows flex to fill the shell exactly, so 6 AM → 12:30 AM always fits with no dead space.
   min-height is the floor: on a short window rows stop shrinking and the grid scrolls. */
.wkgrid{display:grid;position:relative;height:100%;min-height:calc(var(--minHour)*18.5)}
.gutcol{border-right:1px solid var(--edge);display:flex;flex-direction:column;min-height:0}
.gutcol div{flex:1 1 0;font-family:'JetBrains Mono',monospace;font-size:.48rem;color:var(--faint);
  text-align:right;padding-right:5px;transform:translateY(-5px)}
.gutcol div.half{flex:.5 1 0}
.daycol{border-right:1px solid rgba(30,23,51,.7);position:relative;display:flex;flex-direction:column;min-height:0}
.daycol.today{background:rgba(34,211,238,.028)}
.hrline{flex:1 1 0;border-bottom:1px solid rgba(30,23,51,.55)}
.hrline.half{flex:.5 1 0}
.nowline{position:absolute;left:0;right:0;border-top:1px solid var(--alert);z-index:6;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-3px;top:-3px;width:5px;height:5px;background:var(--alert)}
.ev{position:absolute;padding:1px 4px;overflow:hidden;cursor:pointer;z-index:4;font-size:.62rem;
  line-height:1.12;border-left:2px solid}
.ev:hover{filter:brightness(1.35);z-index:7}
.ev b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ev em{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:.5rem;opacity:.8}
.chip{padding:1px 4px;font-size:.59rem;cursor:pointer;border-left:2px solid;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.chip:hover{filter:brightness(1.35)}
.mgrid{flex:1;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--edge);background:rgba(139,92,246,.04)}
.mhead div{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faint);text-align:center;padding:5px 0;border-right:1px solid rgba(30,23,51,.7)}
.mbody{display:grid;grid-template-columns:repeat(7,1fr);overflow-y:auto}
.mcell{border-right:1px solid rgba(30,23,51,.6);border-bottom:1px solid rgba(30,23,51,.6);
  padding:2px 3px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;min-height:70px}
.mcell:hover{background:rgba(139,92,246,.05)}
.mcell .dnum{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);align-self:flex-start;padding:1px 4px}
.mcell.out{background:rgba(0,0,0,.3)}.mcell.out .dnum{color:rgba(74,65,102,.5)}
.mcell.today .dnum{background:var(--cyan);color:#03181D;font-weight:700}
.more{font-family:'JetBrains Mono',monospace;font-size:.48rem;color:var(--faint);padding-left:3px}

/* ── tasks rail ── */
.rail{flex:1;min-width:0;border:1px solid var(--edge);display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(139,92,246,.04),transparent 35%);overflow:hidden}
.rail.hide{display:none}
.railhd{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--edge);flex-shrink:0}
.railhd h2{font-family:'Chakra Petch',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;margin:0}
.railhd .n{font-family:'JetBrains Mono',monospace;font-size:.53rem;color:var(--faint);margin-left:auto}
.railbody{flex:1;overflow-y:auto;padding:10px;display:grid;align-content:start;gap:9px;
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.mod{border:1px solid var(--edge);background:linear-gradient(180deg,var(--panel2),rgba(8,7,14,.6));align-self:start}
.mod.hot{border-color:rgba(255,45,85,.4)}
.mod header{display:flex;align-items:center;gap:6px;padding:5px 9px;border-bottom:1px solid rgba(30,23,51,.8);cursor:pointer}
.mod header h3{font-family:'Chakra Petch',sans-serif;font-size:.61rem;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod.hot header h3{color:var(--alert-hot)}
.mod header .ct{font-family:'JetBrains Mono',monospace;font-size:.51rem;color:var(--faint)}
.caret{color:var(--faint);font-size:.55rem}
.mod.closed .caret{transform:rotate(-90deg);display:inline-block}
.mod.closed ul,.mod.closed .addrow,.mod.closed .hollow{display:none}
.mod ul{list-style:none;margin:0;padding:3px 0}
.mod li{display:flex;align-items:flex-start;gap:7px;padding:3px 9px}
.mod li:hover{background:rgba(139,92,246,.05)}
.box{width:10px;height:10px;flex-shrink:0;margin-top:3px;border:1px solid var(--faint);cursor:pointer}
.box:hover{border-color:var(--violet-hot)}
.box.on{background:var(--violet);border-color:var(--violet-hot)}
.txt{flex:1;font-size:.69rem;line-height:1.2;min-width:0;word-break:break-word}
.txt.on{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--violet)}
.sub{font-family:'JetBrains Mono',monospace;font-size:.5rem;color:var(--muted);margin-top:1px}
.tag{font-family:'JetBrains Mono',monospace;font-size:.44rem;letter-spacing:.1em;text-transform:uppercase;
  padding:1px 3px;border:1px solid;flex-shrink:0;margin-top:2px}
.tag.ASAP,.tag.Deadline{color:var(--alert-hot);border-color:rgba(255,45,85,.5);background:rgba(255,45,85,.12)}
.tag.General{color:var(--violet-hot);border-color:rgba(139,92,246,.35);background:rgba(139,92,246,.08)}
.x{opacity:0;background:none;border:none;color:var(--faint);cursor:pointer;font-size:.58rem;padding:0 1px}
.mod li:hover .x{opacity:1}.x:hover{color:var(--alert)}
.hollow{padding:6px 9px;font-size:.59rem;color:var(--faint);font-style:italic}
.addrow{display:flex;gap:3px;padding:4px 6px;border-top:1px solid rgba(30,23,51,.7)}
.addrow input{flex:1;min-width:0;background:rgba(0,0,0,.5);border:1px solid var(--edge);color:var(--text);
  padding:3px 5px;font-size:.62rem;outline:none}
.addrow input:focus{border-color:var(--violet)}
.addrow select{background:rgba(0,0,0,.5);border:1px solid var(--edge);color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:.46rem;padding:3px 0;outline:none;cursor:pointer;max-width:44px}
.addrow button{background:rgba(139,92,246,.15);border:1px solid var(--violet);color:var(--violet-hot);
  font-size:.57rem;padding:3px 6px;cursor:pointer}
.addrow button:hover{background:var(--violet);color:#07050E}
.newcat{grid-column:1/-1}
.newcat input{width:100%;background:rgba(0,0,0,.35);border:1px dashed var(--edge);color:var(--text);
  padding:5px 7px;font-size:.63rem;outline:none;margin-top:4px}

/* ── modal ── */
.scrim{position:fixed;inset:0;background:rgba(1,1,4,.8);z-index:50;display:flex;align-items:center;
  justify-content:center;padding:18px}
.modal{width:100%;max-width:415px;max-height:90vh;overflow-y:auto;background:var(--panel2);
  border:1px solid var(--edge2)}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--edge)}
.mhd h3{font-family:'Chakra Petch',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;margin:0}
.mhd button{background:none;border:none;color:var(--muted);font-size:.95rem;cursor:pointer}
.mhd button:hover{color:var(--alert)}
.mbd{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fld label{display:block;font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;background:rgba(0,0,0,.55);border:1px solid var(--edge);
  color:var(--text);padding:7px 9px;font-size:.77rem;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--violet)}
.fld textarea{resize:vertical;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chk{display:flex;align-items:center;gap:6px;font-size:.73rem;color:var(--muted);cursor:pointer}
.chk input{width:auto}
.mft{display:flex;gap:7px;padding:10px 14px;border-top:1px solid var(--edge)}
.pri{background:linear-gradient(135deg,var(--violet),#5D2DD6);border:1px solid var(--violet-hot);color:#07050E;
  font-weight:700;padding:8px 16px;cursor:pointer;font-size:.74rem;letter-spacing:.06em}
.pri:disabled{opacity:.5;cursor:wait}
.sec{background:transparent;border:1px solid var(--edge);color:var(--muted);padding:8px 14px;cursor:pointer;font-size:.74rem}
.sec:hover{border-color:var(--violet);color:var(--violet-hot)}
.del{background:transparent;border:1px solid rgba(255,45,85,.4);color:var(--alert);padding:8px 14px;cursor:pointer;font-size:.74rem}
.del:hover{background:rgba(255,45,85,.14)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.swatches button{width:22px;height:22px;border:2px solid transparent;cursor:pointer}
.swatches button.on{border-color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:80;background:rgba(14,12,24,.97);
  border:1px solid var(--edge2);border-left:2px solid var(--violet);color:var(--text);padding:8px 15px;
  font-size:.74rem;pointer-events:none;display:none}
#toast.show{display:block}
#toast.err{border-left-color:var(--alert)}
.banner{border:1px solid rgba(255,45,85,.5);background:rgba(255,45,85,.12);color:#FFC9D4;padding:6px 11px;
  font-size:.69rem;flex-shrink:0;display:flex;align-items:center;gap:8px}

.gate p{color:var(--muted);font-size:.76rem;max-width:340px;margin:0;line-height:1.5}

  :root{--gap:14px;--pad:14px}
  .body{overflow-y:auto}
  .row{flex-direction:column}
  .main{flex:none;max-width:100%}
  .calshell{min-height:560px}
  .rail{flex:none;min-height:360px}
}
@media(max-width:760px){
  .panelhd{flex-wrap:wrap}
  .panelbody{flex-wrap:wrap}
  .sidecol.calscol,.sidecol.syscol{flex:1 1 100%;width:auto}
}

<body>
<div id="toast"></div>
<div id="root"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID = "926235201112-tpe1a7sr8lp9357the1h21alnqme4mg4.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/calendar";
const BASE="https://www.googleapis.com/calendar/v3";
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||"America/Chicago";
const PALETTE=["#8B5CF6","#22D3EE","#FF2D55","#33D69F","#F6BF26","#F4511E","#E67C73","#3F51B5","#8E24AA","#0B8043","#616161"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const LS={prefs:"bd.prefs",tasks:"bd.tasks"};
// Visible day window: 6 AM through 12:30 AM. The half hour past midnight exists so a
// 11:59 PM item renders at full height instead of being clipped by the grid bottom.
const DAY_START=6,DAY_END=24.5,SPAN_H=DAY_END-DAY_START;
// Rows flex to fill the shell and events are placed in percentages, so the whole
// 6 AM → 12:30 AM window always fits exactly — no px fitting, no measuring, no resize pass.
const PCT_MIN=(25/60)/SPAN_H*100;   // 25-minute floor, as a share of the window
const hourLabel=i=>{const x=i%24;return x===0?"12 AM":x===12?"12 PM":x>12?(x-12)+" PM":x+" AM"};
const SEED_CATS=["C S 429","NEU 330","SDS 321","CH 320M","PSY 301","Pierce Lab","Avocado Health","ACC"];
const SEED_TASKS=[
 {id:"s1",cat:"Pierce Lab",text:"Generate histograms",tag:"General",due:null,done:false},
 {id:"s2",cat:"Avocado Health",text:"Kullberg info",tag:"General",due:null,done:false},
 {id:"s3",cat:"ACC",text:"Assignment 7 (Unit 7,8,9)",tag:"Deadline",due:"2026-08-05T23:59",done:false},
 {id:"s4",cat:"ACC",text:"Final Exam",tag:"Deadline",due:"2026-08-07T23:59",done:false}];

let S={view:"week",cursor:new Date(),mini:new Date(),cals:[],events:[],upcoming:[],
  vis:{},colors:{},collapsed:{},interval:5,cats:SEED_CATS.slice(),tasks:SEED_TASKS.slice(),
  status:"idle",error:null,modal:null,saving:false,signedIn:false,sideHide:true,railHide:false};

function savePrefs(){localStorage.setItem(LS.prefs,JSON.stringify({vis:S.vis,colors:S.colors,view:S.view,
  interval:S.interval,collapsed:S.collapsed,cats:S.cats,sideHide:S.sideHide,railHide:S.railHide}))}
function saveTasks(){localStorage.setItem(LS.tasks,JSON.stringify(S.tasks))}
function loadLocal(){
  try{const p=JSON.parse(localStorage.getItem(LS.prefs)||"{}");
    Object.assign(S,{vis:p.vis||{},colors:p.colors||{},collapsed:p.collapsed||{}});
    if(p.view)S.view=p.view;if(p.interval!=null)S.interval=p.interval;if(p.cats)S.cats=p.cats;
    if(p.sideHide!=null)S.sideHide=p.sideHide;if(p.railHide)S.railHide=p.railHide}catch(e){}
  try{const t=localStorage.getItem(LS.tasks);if(t)S.tasks=JSON.parse(t)}catch(e){}
}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const sameDay=(a,b)=>iso(a)===iso(b);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sow=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x};
const som=d=>new Date(d.getFullYear(),d.getMonth(),1);
const mins=d=>d.getHours()*60+d.getMinutes();
function fmtT(d){let h=d.getHours(),m=d.getMinutes(),ap=h>=12?"p":"a";h=h%12||12;return m?`${h}:${pad(m)}${ap}`:`${h}${ap}`}
function localIn(d){return iso(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function range(){
  if(S.view==="day"){const a=new Date(S.cursor);a.setHours(0,0,0,0);return[a,addDays(a,1)]}
  if(S.view==="week"){const a=sow(S.cursor);return[a,addDays(a,7)]}
  const a=sow(som(S.cursor));return[a,addDays(a,42)]}
function label(){
  const[a,b]=range(),e=addDays(b,-1);
  if(S.view==="day")return `${MON[S.cursor.getMonth()]} ${S.cursor.getDate()}, ${S.cursor.getFullYear()}`;
  if(S.view==="month")return `${MON[S.cursor.getMonth()]} ${S.cursor.getFullYear()}`;
  return a.getMonth()===e.getMonth()
    ?`${MON[a.getMonth()].slice(0,3)} ${a.getDate()} – ${e.getDate()}, ${a.getFullYear()}`
    :`${MON[a.getMonth()].slice(0,3)} ${a.getDate()} – ${MON[e.getMonth()].slice(0,3)} ${e.getDate()}, ${e.getFullYear()}`}
function relWhen(d){
  const now=new Date(),t0=new Date(now);t0.setHours(0,0,0,0);
  const days=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-t0)/864e5);
  if(days<0)return "overdue";
  if(days===0)return "today "+fmtT(d);
  if(days===1)return "tomorrow "+fmtT(d);
  if(days<7)return DOW[d.getDay()]+" "+fmtT(d);
  return (d.getMonth()+1)+"/"+d.getDate()+" "+fmtT(d)}

let tokenClient=null,token=null,tokenExp=0,pending=null;
function initAuth(){
  if(!window.google||!google.accounts)return setTimeout(initAuth,300);
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
    callback:r=>{
      if(r.error){pending&&pending.rej(new Error(r.error));pending=null;setStat("err","Sign-in cancelled");render();return}
      token=r.access_token;tokenExp=Date.now()+(r.expires_in-90)*1000;
      sessionStorage.setItem("bd.tok",JSON.stringify({token,tokenExp}));
      localStorage.setItem("bd.connected","1");S.signedIn=true;
      if(pending){pending.res();pending=null}}});
  try{const c=JSON.parse(sessionStorage.getItem("bd.tok")||"null");
    if(c&&c.tokenExp>Date.now()){token=c.token;tokenExp=c.tokenExp;S.signedIn=true;boot();return}}catch(e){}
  if(localStorage.getItem("bd.connected"))connect(false);else render();
}
function connect(interactive=true){
  return new Promise((res,rej)=>{pending={res:()=>{res();boot()},rej};
    tokenClient.requestAccessToken({prompt:interactive?"consent":""})}).catch(()=>{})}
function ensureToken(){
  if(token&&Date.now()<tokenExp)return Promise.resolve();
  return new Promise((res,rej)=>{pending={res,rej};tokenClient.requestAccessToken({prompt:""})})}
function signOut(){
  if(token)google.accounts.oauth2.revoke(token,()=>{});
  token=null;tokenExp=0;S.signedIn=false;S.cals=[];S.events=[];S.upcoming=[];
  sessionStorage.removeItem("bd.tok");localStorage.removeItem("bd.connected");render()}

async function api(path,opts={}){
  await ensureToken();
  const r=await fetch(BASE+path,{...opts,headers:{Authorization:"Bearer "+token,
    "Content-Type":"application/json",...(opts.headers||{})}});
  if(r.status===401){token=null;await ensureToken();return api(path,opts)}
  if(!r.ok){let m=r.status+"";try{m=(await r.json()).error.message}catch(e){}throw new Error(m)}
  return r.status===204?null:r.json()}
function setStat(s,msg){S.status=s;S.error=msg||null;const el=document.getElementById("stat");
  if(el){el.className="stat "+s;el.innerHTML=`<span class="dot"></span>${
    s==="busy"?"sync":s==="err"?"error":s==="ok"?"linked":"idle"}`}}
let toastT=null;
function toast(m,err){const el=document.getElementById("toast");if(!el)return;
  el.textContent=m;el.className="show"+(err?" err":"");clearTimeout(toastT);
  toastT=setTimeout(()=>{el.className=""},2600)}

async function loadCals(){
  const d=await api("/users/me/calendarList?minAccessRole=reader");
  S.cals=(d.items||[]).map(c=>({id:c.id,name:c.summaryOverride||c.summary,primary:!!c.primary,
    gcolor:c.backgroundColor||"#8B5CF6"}));
  S.cals.forEach((c,i)=>{if(!(c.id in S.vis))S.vis[c.id]=true;
    if(!S.colors[c.id])S.colors[c.id]=c.gcolor||PALETTE[i%PALETTE.length]});
  savePrefs()}
function mapEvents(items,calId){
  const out=[];
  (items||[]).forEach(e=>{if(e.status==="cancelled")return;
    const allDay=!!(e.start&&e.start.date);
    out.push({id:e.id,calId,title:e.summary||"(no title)",allDay,
      start:new Date(allDay?e.start.date+"T00:00:00":e.start.dateTime),
      end:new Date(allDay?e.end.date+"T00:00:00":e.end.dateTime),
      location:e.location||"",desc:e.description||"",recurring:!!e.recurringEventId})});
  return out}
async function loadEvents(){
  const on=S.cals.filter(c=>S.vis[c.id]!==false);
  const[a,b]=range();
  const q=`?timeMin=${a.toISOString()}&timeMax=${b.toISOString()}&singleEvents=true&orderBy=startTime&maxResults=250`;
  const out=[];
  await Promise.all(on.map(async c=>{try{
    const d=await api(`/calendars/${encodeURIComponent(c.id)}/events${q}`);
    out.push(...mapEvents(d.items,c.id))}catch(e){console.warn(c.name,e.message)}}));
  S.events=out}
async function loadUpcoming(){
  const on=S.cals.filter(c=>S.vis[c.id]!==false);
  const now=new Date(),to=addDays(now,10);
  const q=`?timeMin=${now.toISOString()}&timeMax=${to.toISOString()}&singleEvents=true&orderBy=startTime&maxResults=25`;
  const out=[];
  await Promise.all(on.map(async c=>{try{
    const d=await api(`/calendars/${encodeURIComponent(c.id)}/events${q}`);
    out.push(...mapEvents(d.items,c.id))}catch(e){}}));
  S.upcoming=out.sort((x,y)=>x.start-y.start)}
async function refresh(silent){
  if(!S.signedIn)return;
  if(!silent)setStat("busy");
  try{await Promise.all([loadEvents(),loadUpcoming()]);setStat("ok")}
  catch(e){setStat("err",e.message)}
  render()}
async function boot(){
  loadLocal();render();setStat("busy");
  try{await loadCals();render();await Promise.all([loadEvents(),loadUpcoming()]);setStat("ok")}
  catch(e){setStat("err",e.message)}
  render();startPoll()}
let poll=null;
function startPoll(){clearInterval(poll);if(!S.interval)return;
  poll=setInterval(()=>{if(document.hidden||S.modal)return;refresh(true)},S.interval*60000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.signedIn)refresh(true)});
window.addEventListener("focus",()=>{if(S.signedIn)refresh(true)});

const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
const col=id=>S.colors[id]||"#8B5CF6";
function tint(hex,a){const n=parseInt(hex.replace("#",""),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}
function calName(id){const c=S.cals.find(x=>x.id===id);return c?c.name:""}
function onDay(d){return S.events.filter(e=>{
    if(S.vis[e.calId]===false)return false;
    if(e.allDay)return iso(d)>=iso(e.start)&&iso(d)<=iso(addDays(e.end,-1));
    return sameDay(e.start,d)}).sort((x,y)=>x.start-y.start)}
function lay(list){const cols=[];list.forEach(e=>{let p=false;
    for(const c of cols){if(c[c.length-1].end<=e.start){c.push(e);p=true;break}}
    if(!p)cols.push([e])});
  const m=new Map();cols.forEach((c,i)=>c.forEach(e=>m.set(e,{i,n:cols.length})));return m}
const uid=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function urgentTasks(){
  return S.tasks.filter(t=>!t.done&&(t.tag==="ASAP"||t.tag==="Deadline"))
    .sort((a,b)=>{if(a.due&&b.due)return new Date(a.due)-new Date(b.due);
      if(a.due)return -1;if(b.due)return 1;return 0})}

function render(){
  const r=document.getElementById("root");
  r.innerHTML=`
  <div class="body">
    ${S.signedIn?upcomingHTML():""}
    <div class="row">
    <div class="main">
      ${S.error?`<div class="banner">${esc(S.error)}<button id="dis">✕</button></div>`:""}
      <div class="calshell hud"><span class="br1"></span><span class="br2"></span>
        ${S.signedIn?(S.view==="month"?monthView():weekView()):gate()}
      </div>
      <div class="side hud ${S.sideHide?"closed":""}"><span class="br1"></span><span class="br2"></span>
        <div class="panelhd">
          <button class="foldbtn" data-foldpanel><span class="caret">▾</span>Controls</button>
          <button class="tbtn" id="today">Today</button>
          <div><button class="arrow" id="prev">‹</button><button class="arrow" id="next">›</button></div>
          <div class="period">${label()}</div>
          <div class="seg">${["day","week","month"].map(v=>
            `<button data-v="${v}" class="${S.view===v?"on":""}">${v}</button>`).join("")}</div>
          <div class="grow"></div>
          <button class="tbtn" id="railtog">${S.railHide?"Tasks ▸":"Tasks ◂"}</button>
        </div>
        <div class="panelbody">
          <div class="sidecol minicol">
            <button class="create" id="create">+ Create Event</button>
            ${miniMonth()}
          </div>
          <div class="sidecol calscol">
            <div class="sechd">Calendars</div>
            <div class="callist">${S.cals.length?S.cals.map(calRow).join(""):'<div class="none">—</div>'}</div>
          </div>
          <div class="sidecol syscol">
            <div class="sechd">Auto-refresh</div>
            <select id="ivl">${[[0,"Off"],[1,"1 min"],[5,"5 min"],[15,"15 min"]].map(([v,l])=>
              `<option value="${v}" ${S.interval===v?"selected":""}>${l}</option>`).join("")}</select>
            ${readout()}
          </div>
        </div>
      </div>
    </div>
    <div class="rail ${S.railHide?"hide":""}">
      <div class="railhd"><h2>Tasks</h2><span class="n">${S.tasks.filter(t=>!t.done).length} open</span></div>
      <div class="railbody">${S.cats.map(modHTML).join("")}
        <div class="newcat"><input id="newcat" placeholder="+ new category"></div></div>
    </div>
    </div>
  </div>
  ${S.modal?modalHTML():""}`;
  setStat(S.status,S.error);wire();
  if(S.signedIn&&S.view!=="month"){const sc=document.querySelector(".scroller");if(sc)sc.scrollTop=0}
}
function readout(){
  const u=urgentTasks().length,open=S.tasks.filter(t=>!t.done).length;
  return `<div class="readout">
    <div><span>SYS</span><b>NOMINAL</b></div>
    <div><span>CAL</span><b>${S.cals.length}</b></div>
    <div><span>TASKS</span><b>${open}</b></div>
    <div class="${u?"hot":""}"><span>URGENT</span><b>${u}</b></div></div>`}
function gate(){
  return `<div class="gate"><h2>Connect Google Calendar</h2>
    <p>Sign in with your Google account to load your calendars.</p>
    <button class="pri" id="connect">Sign in with Google</button></div>`}
function upcomingHTML(){
  const evs=S.upcoming.slice(0,10).map(e=>({kind:"event",when:e.start,title:e.title,
    sub:calName(e.calId),id:e.id,calId:e.calId}));
  const tks=urgentTasks().map(t=>({kind:"task",when:t.due?new Date(t.due):null,title:t.text,
    sub:t.cat+" · "+t.tag,id:t.id}));
  let all=[...evs,...tks].sort((a,b)=>{
    if(a.when&&b.when)return a.when-b.when;if(a.when)return -1;if(b.when)return 1;return 0}).slice(0,12);
  let h=`<div class="upnav"><h2>◤ Upcoming</h2><div class="ln"></div><span class="ct">${all.length} items · next 10 days</span>
    <div id="stat" class="stat"><span class="dot"></span>idle</div>
    <button class="tbtn" id="rf">Refresh</button>
    <button class="tbtn" id="out">Sign out</button></div>`;
  if(!all.length)return h+`<div class="upstrip"><div class="upempty">NOTHING URGENT — ALL CLEAR</div></div>`;
  h+=`<div class="upstrip">`;
  all.forEach(x=>{
    h+=`<div class="upcard ${x.kind==="task"?"task":""} hud" ${x.kind==="event"?`data-ev="${esc(x.id)}|${esc(x.calId)}"`:""}>
      <span class="br1"></span><span class="br2"></span>
      <div class="when"><span>${x.when?relWhen(x.when):"no date"}</span><i>${x.kind==="task"?"TASK":"EVT"}</i></div>
      <div class="ttl">${esc(x.title)}</div>
      <div class="sub">${esc(x.sub)}</div></div>`});
  return h+`</div>`}
function calRow(c){
  const on=S.vis[c.id]!==false;
  return `<div class="calrow ${on?"":"off"}" data-cal="${esc(c.id)}">
    <div class="swatch" style="background:${on?col(c.id):"transparent"};border-color:${col(c.id)}"></div>
    <div class="calname" title="${esc(c.name)}">${esc(c.name)}</div>
    <button class="dotbtn" data-color="${esc(c.id)}">◐</button></div>`}
function miniMonth(){
  const c=S.mini,st=sow(som(c)),td=new Date();
  let h=`<div class="mini"><div class="minihead"><button id="mp">‹</button>
    <b>${MON[c.getMonth()].slice(0,3).toUpperCase()} ${c.getFullYear()}</b><button id="mn">›</button></div>
    <div class="minigrid">${["S","M","T","W","T","F","S"].map(d=>`<span>${d}</span>`).join("")}`;
  for(let i=0;i<42;i++){const d=addDays(st,i);
    h+=`<button class="${d.getMonth()!==c.getMonth()?"out":""} ${sameDay(d,td)?"today":""} ${sameDay(d,S.cursor)?"sel":""}"
      data-jump="${iso(d)}">${d.getDate()}</button>`}
  return h+"</div></div>"}
function weekView(){
  const[a]=range(),n=S.view==="day"?1:7,days=Array.from({length:n},(_,i)=>addDays(a,i)),td=new Date();
  const gc=`grid-template-columns:46px repeat(${n},1fr)`;
  let h=`<div class="wkhead" style="${gc}"><div class="gut"></div>`;
  days.forEach(d=>h+=`<div class="dh ${sameDay(d,td)?"today":""}"><div class="dn">${DOW[d.getDay()]}</div><div class="dd">${d.getDate()}</div></div>`);
  h+=`</div><div class="allday" style="${gc}"><div class="gut">all-day</div>`;
  days.forEach(d=>{h+=`<div class="adc">${onDay(d).filter(e=>e.allDay).map(e=>
    `<div class="chip" data-ev="${esc(e.id)}|${esc(e.calId)}" style="background:${tint(col(e.calId),.2)};border-left-color:${col(e.calId)}">${esc(e.title)}</div>`).join("")}</div>`});
  h+=`</div><div class="scroller"><div class="wkgrid" style="${gc}"><div class="gutcol">`;
  for(let i=DAY_START;i<24;i++)h+=`<div>${hourLabel(i)}</div>`;
  h+=`<div class="half">${hourLabel(24)}</div></div>`;
  days.forEach(d=>{
    const isT=sameDay(d,td);h+=`<div class="daycol ${isT?"today":""}" data-day="${iso(d)}">`;
    for(let i=DAY_START;i<24;i++)h+=`<div class="hrline"></div>`;
    h+=`<div class="hrline half"></div>`;
    const timed=onDay(d).filter(e=>!e.allDay),L=lay(timed);
    timed.forEach(e=>{const p=L.get(e);
      let durH=(e.end-e.start)/36e5;if(durH<25/60)durH=25/60;
      // Clamp into the visible window. Anything starting before 6 AM still renders as a
      // sliver at the top rather than vanishing — its real time stays in the label.
      let top=(mins(e.start)/60-DAY_START)/SPAN_H*100,hgt=durH/SPAN_H*100;
      if(top<0){hgt+=top;top=0}
      top=Math.min(top,100-PCT_MIN);
      hgt=Math.max(PCT_MIN,Math.min(hgt,100-top));
      const w=100/p.n,c2=col(e.calId);
      h+=`<div class="ev" data-ev="${esc(e.id)}|${esc(e.calId)}"
        style="top:${top.toFixed(3)}%;height:${hgt.toFixed(3)}%;left:calc(${p.i*w}% + 1px);width:calc(${w}% - 2px);
        background:${tint(c2,.22)};border-left-color:${c2};color:${c2}">
        <b>${esc(e.title)}</b><em>${fmtT(e.start)}</em></div>`});
    if(isT){const nh=mins(new Date())/60;
      if(nh>=DAY_START&&nh<=DAY_END)h+=`<div class="nowline" style="top:${((nh-DAY_START)/SPAN_H*100).toFixed(3)}%"></div>`}
    h+="</div>"});
  return h+"</div></div>"}
function monthView(){
  const[a]=range(),m=S.cursor.getMonth(),td=new Date();
  let h=`<div class="mgrid"><div class="mhead">${DOW.map(d=>`<div>${d}</div>`).join("")}</div><div class="mbody">`;
  for(let i=0;i<42;i++){const d=addDays(a,i),list=onDay(d);
    h+=`<div class="mcell ${d.getMonth()!==m?"out":""} ${sameDay(d,td)?"today":""}" data-new="${iso(d)}">
      <div class="dnum">${d.getDate()}</div>
      ${list.slice(0,3).map(e=>`<div class="chip" data-ev="${esc(e.id)}|${esc(e.calId)}"
        style="background:${tint(col(e.calId),.18)};border-left-color:${col(e.calId)}">${
        e.allDay?"":`<span class="mono" style="color:${col(e.calId)};font-size:.48rem">${fmtT(e.start)} </span>`}${esc(e.title)}</div>`).join("")}
      ${list.length>3?`<div class="more">+${list.length-3}</div>`:""}</div>`}
  return h+"</div></div>"}
function modHTML(cat){
  const list=S.tasks.filter(t=>t.cat===cat),openN=list.filter(t=>!t.done).length;
  const hot=list.some(t=>!t.done&&(t.tag==="ASAP"||t.tag==="Deadline"));
  let h=`<div class="mod ${hot?"hot":""} ${S.collapsed[cat]?"closed":""}">
    <header data-fold="${esc(cat)}"><span class="caret">▾</span><h3>${esc(cat)}</h3><span class="ct">${openN}/${list.length}</span></header>`;
  if(!list.length)h+=`<div class="hollow">Nothing yet.</div>`;
  else{h+="<ul>";list.forEach(t=>{
    h+=`<li><div class="box ${t.done?"on":""}" data-tg="${t.id}" role="checkbox" tabindex="0" aria-checked="${t.done}"></div>
      <div class="txt ${t.done?"on":""}">${esc(t.text)}${t.due?`<div class="sub">${new Date(t.due).toLocaleString(undefined,{weekday:"short",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})}</div>`:""}</div>
      <span class="tag ${t.tag}">${t.tag}</span><button class="x" data-rm="${t.id}">✕</button></li>`});h+="</ul>"}
  return h+`<div class="addrow"><input data-in="${esc(cat)}" placeholder="Add">
    <select data-sel="${esc(cat)}"><option>General</option><option>ASAP</option><option>Deadline</option></select>
    <button data-add="${esc(cat)}">+</button></div></div>`}
function modalHTML(){
  const m=S.modal;
  if(m.type==="color")return `<div class="scrim" data-close><div class="modal" style="max-width:250px">
    <div class="mhd"><h3>Color</h3><button data-close>✕</button></div>
    <div class="mbd"><div class="swatches">${PALETTE.map(c=>
      `<button data-pick="${c}" class="${col(m.calId)===c?"on":""}" style="background:${c}"></button>`).join("")}</div></div></div></div>`;
  const f=m.form;
  return `<div class="scrim" data-close><div class="modal hud"><span class="br1"></span><span class="br2"></span>
    <div class="mhd"><h3>${m.type==="edit"?"Edit event":"New event"}</h3><button data-close>✕</button></div>
    <div class="mbd">
      ${m.recurring?`<div style="font-size:.66rem;color:var(--muted)">One instance of a repeating event — changes apply to this instance only.</div>`:""}
      <div class="fld"><label>Title</label><input id="f-t" value="${esc(f.title)}" placeholder="Add title"></div>
      <div class="fld"><label>Calendar</label><select id="f-c">${S.cals.map(c=>
        `<option value="${esc(c.id)}" ${c.id===f.calId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
      <label class="chk"><input type="checkbox" id="f-a" ${f.allDay?"checked":""}> All day</label>
      ${f.allDay?`<div class="two">
        <div class="fld"><label>Start</label><input type="date" id="f-d1" value="${f.d1}"></div>
        <div class="fld"><label>End</label><input type="date" id="f-d2" value="${f.d2}"></div></div>`
      :`<div class="two">
        <div class="fld"><label>Starts</label><input type="datetime-local" id="f-s" value="${f.start}"></div>
        <div class="fld"><label>Ends</label><input type="datetime-local" id="f-e" value="${f.end}"></div></div>`}
      <div class="fld"><label>Location</label><input id="f-l" value="${esc(f.location)}"></div>
      <div class="fld"><label>Description</label><textarea id="f-x">${esc(f.desc)}</textarea></div>
    </div>
    <div class="mft">${m.type==="edit"?`<button class="del" id="f-del">Delete</button>`:""}
      <div class="grow"></div><button class="sec" data-close>Cancel</button>
      <button class="pri" id="f-save" ${S.saving?"disabled":""}>${S.saving?"Saving…":"Save"}</button></div>
  </div></div>`}
function newForm(day,hr){
  const d=day?new Date(day+"T00:00:00"):new Date();
  d.setHours(hr!=null?hr:new Date().getHours()+1,0,0,0);
  const e=new Date(d);e.setHours(e.getHours()+1);
  const pc=(S.cals.find(c=>c.primary)||S.cals[0]||{}).id||"";
  return{id:null,calId:pc,orig:pc,title:"",allDay:false,start:localIn(d),end:localIn(e),
    d1:iso(d),d2:iso(addDays(d,1)),location:"",desc:""}}
function editForm(e){return{id:e.id,calId:e.calId,orig:e.calId,title:e.title,allDay:e.allDay,
  start:localIn(e.start),end:localIn(e.end),d1:iso(e.start),d2:iso(e.end),location:e.location,desc:e.desc}}
function readForm(){
  const f=S.modal.form,g=id=>document.getElementById(id);
  f.title=g("f-t").value.trim()||"(no title)";f.calId=g("f-c").value;f.allDay=g("f-a").checked;
  if(f.allDay){f.d1=g("f-d1").value;f.d2=g("f-d2").value}else{f.start=g("f-s").value;f.end=g("f-e").value}
  f.location=g("f-l").value.trim();f.desc=g("f-x").value.trim();return f}
async function persist(f){
  const body={summary:f.title,location:f.location,description:f.desc};
  if(f.allDay){body.start={date:f.d1};body.end={date:f.d2}}
  else{body.start={dateTime:new Date(f.start).toISOString(),timeZone:TZ};
       body.end={dateTime:new Date(f.end).toISOString(),timeZone:TZ}}
  if(!f.id){await api(`/calendars/${encodeURIComponent(f.calId)}/events`,{method:"POST",body:JSON.stringify(body)});return}
  if(f.calId!==f.orig)await api(`/calendars/${encodeURIComponent(f.orig)}/events/${encodeURIComponent(f.id)}/move?destination=${encodeURIComponent(f.calId)}`,{method:"POST"});
  await api(`/calendars/${encodeURIComponent(f.calId)}/events/${encodeURIComponent(f.id)}`,{method:"PATCH",body:JSON.stringify(body)})}

function wire(){
  const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
  const step=n=>{
    if(S.view==="day")S.cursor=addDays(S.cursor,n);
    else if(S.view==="week")S.cursor=addDays(S.cursor,7*n);
    else S.cursor=new Date(S.cursor.getFullYear(),S.cursor.getMonth()+n,1);
    S.mini=new Date(S.cursor);render();refresh()};
  $("[data-foldpanel]").onclick=()=>{S.sideHide=!S.sideHide;savePrefs();render()};
  $("#railtog").onclick=()=>{S.railHide=!S.railHide;savePrefs();render()};
  $("#today").onclick=()=>{S.cursor=new Date();S.mini=new Date();render();refresh()};
  $("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
  const rf=$("#rf");if(rf)rf.onclick=()=>refresh();
  const o=$("#out");if(o)o.onclick=signOut;
  const cn=$("#connect");if(cn)cn.onclick=()=>connect(true);
  const ds=$("#dis");if(ds)ds.onclick=()=>{S.error=null;render()};
  $$("[data-v]").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;savePrefs();render();refresh()});
  const ivl=$("#ivl");if(ivl)ivl.onchange=()=>{S.interval=+ivl.value;savePrefs();startPoll()};
  const mp=$("#mp"),mn=$("#mn");
  if(mp)mp.onclick=()=>{S.mini=new Date(S.mini.getFullYear(),S.mini.getMonth()-1,1);render()};
  if(mn)mn.onclick=()=>{S.mini=new Date(S.mini.getFullYear(),S.mini.getMonth()+1,1);render()};
  $$("[data-jump]").forEach(b=>b.onclick=()=>{S.cursor=new Date(b.dataset.jump+"T00:00:00");render();refresh()});
  $$("[data-cal]").forEach(r=>r.onclick=e=>{if(e.target.dataset.color)return;
    const id=r.dataset.cal;S.vis[id]=S.vis[id]===false;savePrefs();render();refresh()});
  $$("[data-color]").forEach(b=>b.onclick=e=>{e.stopPropagation();S.modal={type:"color",calId:b.dataset.color};render()});
  const cr=$("#create");if(cr)cr.onclick=()=>{S.modal={type:"new",form:newForm(iso(S.cursor))};render()};
  $$("[data-new]").forEach(c=>c.onclick=e=>{if(e.target.closest("[data-ev]"))return;
    S.modal={type:"new",form:newForm(c.dataset.new)};render()});
  $$("[data-ev]").forEach(el=>el.onclick=e=>{e.stopPropagation();
    const[id,cid]=el.dataset.ev.split("|");
    let ev=S.events.find(x=>x.id===id&&x.calId===cid)||S.upcoming.find(x=>x.id===id&&x.calId===cid);
    if(ev){S.modal={type:"edit",form:editForm(ev),ev,recurring:ev.recurring};render()}});
  $$(".daycol").forEach(c=>c.ondblclick=e=>{if(e.target.closest(".ev"))return;
    const r=c.getBoundingClientRect();
    const hr=Math.min(23,Math.max(0,Math.floor(DAY_START+(e.clientY-r.top)/r.height*SPAN_H)));
    S.modal={type:"new",form:newForm(c.dataset.day,hr)};render()});
  $$("[data-close]").forEach(el=>el.onclick=e=>{if(e.target===el){S.modal=null;render()}});
  $$("[data-pick]").forEach(b=>b.onclick=()=>{S.colors[S.modal.calId]=b.dataset.pick;savePrefs();S.modal=null;render()});
  const fa=$("#f-a");if(fa)fa.onchange=()=>{readForm();S.modal.form.allDay=fa.checked;render()};
  const fs=$("#f-save");if(fs)fs.onclick=async()=>{
    const f=readForm();S.saving=true;render();
    try{await persist(f);S.modal=null;S.saving=false;await refresh();toast((f.id?"Updated · ":"Created · ")+f.title)}
    catch(err){S.saving=false;setStat("err",err.message);render();toast(err.message,true)}};
  const fd=$("#f-del");if(fd)fd.onclick=async()=>{
    if(!confirm("Delete this event from Google Calendar?"))return;
    const f=S.modal.form;S.saving=true;render();
    try{await api(`/calendars/${encodeURIComponent(f.calId)}/events/${encodeURIComponent(f.id)}`,{method:"DELETE"});
      S.modal=null;S.saving=false;await refresh();toast("Deleted · "+f.title)}
    catch(err){S.saving=false;setStat("err",err.message);render();toast(err.message,true)}};
  $$("[data-fold]").forEach(h=>h.onclick=()=>{const c=h.dataset.fold;S.collapsed[c]=!S.collapsed[c];savePrefs();render()});
  $$("[data-tg]").forEach(el=>{const go=()=>{const t=S.tasks.find(x=>x.id===el.dataset.tg);
    if(t){t.done=!t.done;saveTasks();render();if(t.done)toast("Completed · "+t.text)}};
    el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  $$("[data-rm]").forEach(el=>el.onclick=()=>{const t=S.tasks.find(x=>x.id===el.dataset.rm);
    S.tasks=S.tasks.filter(x=>x.id!==el.dataset.rm);saveTasks();render();if(t)toast("Removed · "+t.text)});
  $$("[data-add]").forEach(b=>{const cat=b.dataset.add;
    const add=()=>{const i=document.querySelector(`[data-in="${CSS.escape(cat)}"]`),
      s=document.querySelector(`[data-sel="${CSS.escape(cat)}"]`),v=i.value.trim();if(!v)return;
      S.tasks.push({id:uid(),cat,text:v,tag:s.value,due:null,done:false});saveTasks();render();
      toast("Added to "+cat);
      const n=document.querySelector(`[data-in="${CSS.escape(cat)}"]`);if(n)n.focus()};
    b.onclick=add;
    document.querySelector(`[data-in="${CSS.escape(cat)}"]`).onkeydown=e=>{if(e.key==="Enter")add()}});
  const nc=$("#newcat");if(nc)nc.onkeydown=e=>{if(e.key==="Enter"){const v=nc.value.trim();
    if(v&&!S.cats.includes(v)){S.cats.push(v);savePrefs();render()}}};
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal){S.modal=null;render()}});
setInterval(()=>{if(!S.signedIn||S.view==="month"||S.modal)return;
  const nl=document.querySelector(".nowline");
  if(nl)nl.style.top=((mins(new Date())/60-DAY_START)/SPAN_H*100).toFixed(3)+"%"},30000);
loadLocal();render();initAuth();
</script>
</body>
</html>
